name: Manifestation Weekly Report

on:
  schedule:
    - cron: "55 21 * * 6" # UTC 週六 21:55 = 台北時間 週日 05:55
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

# 最小權限：只需寫入 repo contents 來 commit 報告
permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Determine target date
        id: date
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            # Validate format: must be YYYY-MM-DD
            if echo "$INPUT_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              TARGET="$INPUT_DATE"
            else
              echo "Invalid date format, falling back to today"
              TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            fi
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target date: $TARGET"

      - name: Fetch papers from PubMed
        id: fetch
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          TARGET_DATE: ${{ steps.date.outputs.target }}
        run: |
          node scripts/fetch-papers.mjs \
            --days 21 \
            --ret-max 30 \
            --max-papers 60 \
            --date "$TARGET_DATE"
        continue-on-error: true

      - name: Validate papers data
        id: papers
        run: |
          if [ -f papers.json ] && node -e "JSON.parse(require('fs').readFileSync('papers.json','utf-8'))" 2>/dev/null; then
            COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('papers.json','utf-8')); process.stdout.write(String(d.count||0))")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Papers found: $COUNT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            node -e "
              const fs=require('fs');
              const date=process.env.TARGET_DATE || new Date().toISOString().slice(0,10);
              fs.writeFileSync('papers.json', JSON.stringify({date, count:0, totalFound:0, dedupRemoved:0, papers:[]}, null, 2));
            "
            echo "No valid papers data, will generate empty report"
          fi
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}

      - name: Generate report with NVIDIA Nemotron
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_BASE: https://integrate.api.nvidia.com/v1
          NVIDIA_TIMEOUT_MS: "480000"
          NVIDIA_MAX_TOKENS: "16384"
          NVIDIA_MODELS: "nvidia/nemotron-3-super-120b-a12b,nvidia/nemotron-3-nano-30b-a3b"
          REPORT_DATE: ${{ steps.date.outputs.target }}
        run: |
          node scripts/generate-report.mjs \
            --input papers.json \
            --output "docs/manifestation-${REPORT_DATE}.html"

      - name: Generate index page
        run: node scripts/generate-index.mjs

      - name: Commit and push
        env:
          REPORT_DATE: ${{ steps.date.outputs.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "✨ manifestation weekly report: ${REPORT_DATE}"
            git pull --rebase origin main
            git push
          fi

      - name: Summary
        env:
          REPORT_DATE: ${{ steps.date.outputs.target }}
          PAPER_COUNT: ${{ steps.papers.outputs.count }}
        run: |
          {
            echo "### ✨ Manifestation Weekly Report"
            echo "**Date:** ${REPORT_DATE}"
            echo "**New papers analyzed:** ${PAPER_COUNT}"
            echo "**Report:** [manifestation-${REPORT_DATE}.html](https://u8901006.github.io/Manifestation-Research/manifestation-${REPORT_DATE}.html)"
          } >> "$GITHUB_STEP_SUMMARY"
