<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Manifestation Research · 顯化研究文獻周報</title>
<style>
  :root { --bg: #f6f1e8; --surface: #fffaf2; --line: #d8c5ab; --text: #2b2118; --muted: #766453; --accent: #8c4f2b; --accent-soft: #ead2bf; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(circle at top, #fff6ea 0, var(--bg) 55%, #ead8c6 100%); color: var(--text); font-family: "Noto Sans TC", "PingFang TC", "Helvetica Neue", Arial, sans-serif; min-height: 100vh; }
  .container { max-width: 640px; margin: 0 auto; padding: 80px 24px; text-align: center; }
  .logo { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: var(--accent); font-size: 14px; margin-bottom: 24px; }
  .info { color: var(--muted); font-size: 14px; line-height: 1.8; margin-bottom: 32px; }
  footer { margin-top: 56px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">✨</div>
  <h1>Manifestation Research</h1>
  <p class="subtitle">顯化研究文獻周報 · 每週自動更新</p>
  <p class="info">第一期周報即將由 GitHub Actions 自動生成。<br/>排程：每週日 台北時間 05:55。</p>
  <footer>
    <p>Powered by PubMed + GLM-5-Turbo · <a href="https://github.com/u8901006/Manifestation-Research">GitHub</a></p>
  </footer>
</div>
</body>
</html>
